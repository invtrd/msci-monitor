<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSCI Korea 베이시스 모니터링</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    padding: 12px;
    font-size: 13px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    margin-bottom: 10px;
  }
  .header h1 { font-size: 16px; color: #58a6ff; }
  .status { display: flex; gap: 16px; align-items: center; font-size: 12px; }
  .status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #f85149;
    margin-right: 6px;
  }
  .status-dot.online { background: #3fb950; }
  .updated { color: #8b949e; }
  .error-banner {
    background: #5c1e1e;
    color: #ff7b72;
    padding: 8px 12px;
    border-radius: 4px;
    margin-bottom: 10px;
    display: none;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #161b22;
    border: 1px solid #30363d;
  }
  th {
    background: #21262d;
    padding: 8px 6px;
    text-align: right;
    font-weight: 600;
    color: #58a6ff;
    border-bottom: 2px solid #30363d;
    white-space: nowrap;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  th:nth-child(1), th:nth-child(2), th:nth-child(3) { text-align: left; }
  td {
    padding: 6px;
    text-align: right;
    border-bottom: 1px solid #21262d;
    white-space: nowrap;
  }
  td:nth-child(1), td:nth-child(2), td:nth-child(3) { text-align: left; }
  tr:hover { background: #1c2128; }
  .pos { color: #3fb950; }
  .neg { color: #f85149; }
  .rank-1 { background: rgba(63, 185, 80, 0.15); font-weight: 600; }
  .rank-2 { background: rgba(63, 185, 80, 0.08); }
  .code { color: #79c0ff; font-family: 'Consolas', monospace; }
  .rate-input {
    width: 70px;
    padding: 3px 5px;
    background: #0d1117;
    border: 1px solid #30363d;
    color: #c9d1d9;
    text-align: right;
    border-radius: 3px;
    font-size: 12px;
  }
  .rate-input:focus { outline: none; border-color: #58a6ff; }
  .rate-input.pending { border-color: #d29922; background: #2d2406; }
  .rate-input.success { border-color: #3fb950; }
  .rate-input.error { border-color: #f85149; }
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 10px 16px;
    border-radius: 4px;
    color: white;
    font-size: 13px;
    z-index: 1000;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .toast.show { opacity: 1; }
  .toast.success { background: #238636; }
  .toast.error { background: #da3633; }
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
    font-size: 12px;
  }
  .controls input {
    padding: 5px 8px;
    background: #0d1117;
    border: 1px solid #30363d;
    color: #c9d1d9;
    border-radius: 4px;
    width: 200px;
  }
  .table-wrapper { overflow-x: auto; max-height: calc(100vh - 130px); overflow-y: auto; }
</style>
</head>
<body>

<div class="header">
  <h1>📊 MSCI Korea 베이시스 모니터링</h1>
  <div class="status">
    <span><span id="statusDot" class="status-dot"></span><span id="statusText">연결중...</span></span>
    <span class="updated">마지막 업데이트: <span id="updatedTime">-</span></span>
    <span class="updated">총 <span id="totalCount">0</span>개 종목</span>
  </div>
</div>

<div class="error-banner" id="errorBanner"></div>

<div class="controls">
  <input type="text" id="searchInput" placeholder="종목명/코드 검색...">
</div>

<div class="table-wrapper">
<table id="dataTable">
<thead>
  <tr>
    <th>코드</th>
    <th>종목명</th>
    <th>선물</th>
    <th>전일종가</th>
    <th>현재가</th>
    <th>미결제</th>
    <th>대차요율</th>
    <th>연율환산</th>
    <th>이론B</th>
    <th>매도B</th>
    <th>매수B</th>
    <th>매도익</th>
    <th>매도순위</th>
    <th>매수익</th>
    <th>매수순위</th>
    <th>요율수정</th>
  </tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, push, set, remove }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ─── Firebase 설정 (본인 프로젝트 설정으로 교체) ─────────────
const firebaseConfig = {
  apiKey: "AIzaSyBegZuPoPAQhigTqLl_FnsW0HT9zEXNUOA",
  authDomain: "monitor-test-d1eca.firebaseapp.com",
  databaseURL: "https://monitor-test-d1eca-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "monitor-test-d1eca",
  storageBucket: "monitor-test-d1eca.firebasestorage.app",
  messagingSenderId: "12190638072",
  appId: "1:12190638072:web:6b479e29073bb23592400d"
};
// ────────────────────────────────────────────────────────

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

const dataRef = ref(database, '/data');
const statusRef = ref(database, '/status');
const commandsRef = ref(database, '/commands');

let currentRows = [];
let pendingCommands = {};  // {code: cmdId}

// 검색 필터
const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', () => renderTable(currentRows));

// 데이터 구독
onValue(dataRef, (snapshot) => {
  const data = snapshot.val();
  if (!data) return;

  currentRows = data.rows || [];
  document.getElementById('updatedTime').textContent = data.updated || '-';
  document.getElementById('totalCount').textContent = data.total || 0;
  renderTable(currentRows);
});

// 상태 구독
onValue(statusRef, (snapshot) => {
  const status = snapshot.val();
  if (!status) return;

  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  const banner = document.getElementById('errorBanner');

  if (status.online) {
    dot.classList.add('online');
    text.textContent = 'PC2 연결됨';
  } else {
    dot.classList.remove('online');
    text.textContent = 'PC2 오프라인';
  }

  if (status.error) {
    banner.style.display = 'block';
    banner.textContent = '⚠️ ' + status.error;
  } else {
    banner.style.display = 'none';
  }
});

// 명령 상태 구독 (요율 변경 결과 모니터링)
onValue(commandsRef, (snapshot) => {
  const cmds = snapshot.val() || {};
  Object.entries(cmds).forEach(([id, cmd]) => {
    if (cmd.status === 'error') {
      const input = document.querySelector(`[data-code="${cmd.code}"]`);
      if (input) {
        input.classList.remove('pending');
        input.classList.add('error');
        showToast('error', `요율 변경 실패: ${cmd.error}`);
      }
      // 5초 후 명령 제거
      setTimeout(() => remove(ref(database, `/commands/${id}`)), 5000);
    }
  });
});

function renderTable(rows) {
  const filter = searchInput.value.toLowerCase();
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  rows
    .filter(r => !filter ||
      r.name.toLowerCase().includes(filter) ||
      r.code.includes(filter))
    .forEach(r => {
      const tr = document.createElement('tr');
      const sellRank = r.sell_rank;
      if (sellRank === '1') tr.classList.add('rank-1');
      else if (sellRank === '2' || sellRank === '3') tr.classList.add('rank-2');

      const sellProfitClass = (r.sell_profit_raw > 0) ? 'pos' : (r.sell_profit_raw < 0 ? 'neg' : '');
      const buyProfitClass = (r.buy_profit_raw > 0) ? 'pos' : (r.buy_profit_raw < 0 ? 'neg' : '');

      tr.innerHTML = `
        <td class="code">${r.code}</td>
        <td>${r.name}</td>
        <td>${r.fut_ticker}</td>
        <td>${r.prev_close}</td>
        <td>${r.current}</td>
        <td>${r.open_interest}</td>
        <td>${r.loan_rate}</td>
        <td>${r.rate_annual}</td>
        <td>${r.theo_basis}</td>
        <td>${r.sell_basis}</td>
        <td>${r.buy_basis}</td>
        <td class="${sellProfitClass}">${r.sell_profit}</td>
        <td>${r.sell_rank}</td>
        <td class="${buyProfitClass}">${r.buy_profit}</td>
        <td>${r.buy_rank}</td>
        <td>
          <input type="number" step="0.0001" class="rate-input"
                 data-code="${r.code}"
                 placeholder="${r.loan_rate}">
        </td>
      `;
      tbody.appendChild(tr);
    });

  // 요율 입력 이벤트
  document.querySelectorAll('.rate-input').forEach(inp => {
    inp.addEventListener('keydown', async (e) => {
      if (e.key === 'Enter') {
        const code = inp.dataset.code;
        const rate = parseFloat(inp.value);
        if (isNaN(rate)) {
          showToast('error', '숫자를 입력하세요');
          return;
        }
        await sendRateChange(code, rate, inp);
      }
    });
  });
}

async function sendRateChange(code, rate, inputEl) {
  inputEl.classList.remove('error', 'success');
  inputEl.classList.add('pending');

  try {
    const newCmdRef = push(commandsRef);
    await set(newCmdRef, {
      code: code,
      rate: rate,
      status: 'pending',
      created_at: new Date().toISOString()
    });
    showToast('success', `요율 변경 요청 전송: ${code} → ${(rate*100).toFixed(4)}%`);

    // 3초 후 자동으로 표시 정상화 (성공 시 PC2가 명령 삭제하므로 ↑ 리스너에서 처리됨)
    setTimeout(() => {
      inputEl.classList.remove('pending');
      inputEl.classList.add('success');
      inputEl.value = '';
      setTimeout(() => inputEl.classList.remove('success'), 2000);
    }, 1500);

  } catch (e) {
    inputEl.classList.remove('pending');
    inputEl.classList.add('error');
    showToast('error', '전송 실패: ' + e.message);
  }
}

function showToast(type, msg) {
  const t = document.getElementById('toast');
  t.className = 'toast ' + type + ' show';
  t.textContent = msg;
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>

</body>
</html>
